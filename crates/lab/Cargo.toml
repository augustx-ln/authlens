[package]
name = "authlens-lab"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Isolated live detection target for the AuthLens Docker lab"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
