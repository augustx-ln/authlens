[package]
name = "authlens-analyzer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "In-browser authentication log parsing and detection core"
repository = "https://github.com/augustx-ln/authlens"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
evtx = { version = "0.15.1", default-features = false }
js-sys = "0.3"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
